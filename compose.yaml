services:
  user-db:
    image: postgres:17-alpine
    container_name: user-service-db
    environment:
      POSTGRES_USER: ${DB_USERNAME:-chaika}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123}
      POSTGRES_DB: user_db
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: user-service-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build: .
    container_name: user-service-chaika-inno
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_USERNAME=${DB_USERNAME:-chaika}
      - DB_PASSWORD=${DB_PASSWORD:-123}
    depends_on:
      user-db:
        condition: service_healthy
      redis:
        condition: service_healthy