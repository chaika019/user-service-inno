name: CI Pipeline

on:
  push:
    branches:
      - dev
      - 'feature/**'
  pull_request:
    branches:
      - dev

jobs:
  build-and-test:
    name: Build, Test, Analyze and Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test with Maven
        run: mvn clean verify -Dsurefire.shutdown=exit

      - name: SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:5.0.0.4389:sonar \
            -Dsonar.projectKey=user-service-chaika-inno \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Branch Sanitize Name
        id: branch-name
        run: |
          CLEAN_NAME=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9._-][^a-zA-Z0-9._-]*/-/g')
          echo "tag_name=${CLEAN_NAME}" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/user-service-chaika-inno:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/user-service-chaika-inno:${{ steps.branch-name.outputs.tag_name }}
            ${{ github.ref_name == 'dev' && format('{0}/user-service-chaika-inno:latest', secrets.DOCKERHUB_USERNAME) || '' }}